name: RoomScope checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check production build
        run: |
          npm run preview -- --port 4173 > /tmp/roomscope-preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/workspace.html >/dev/null && break; sleep 1; done
          BASE_URL=http://127.0.0.1:4173 npm run test:e2e
  dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: roomscope-core/requirements-lock.txt
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -r roomscope-core/requirements-lock.txt
      - run: python -m ruff check roomscope-core
      - run: python -m pytest
      - run: python roomscope-core/pipeline.py --out roomscope-core/output/ci --label CI
